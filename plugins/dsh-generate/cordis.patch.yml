# @muen/dsh-generate — bundle patch layer (Epic 61).
#
# One row: mount this package into the profile tree. The host half serves the provider
# routes — the list, each provider's key, and each provider's workflows — and the
# client half registers the `generate` right-panel tab type, its body and its chip,
# the guide entry that puts the "Generate" card on the right panel's
# start page, and the ONE settings page that lists every provider. The card is the
# harness's own standard card; the pane behind it is the hub that holds every
# workflow surface.
#
# Row id `generate` is also the profile directory name the surface's own data lives
# under (`<profile>/generate/`), one directory per provider inside it
# (`<profile>/generate/<provider>/adapters/<name>.json`) — so renaming the row again
# moves the data with it. The name is provider-neutral on purpose: this plugin holds
# three providers (Krea for images, RunningHub and Comfy Cloud for
# workflows — founder, 2026-09-23; Magnific was registered and removed the same
# day), and both the surface and its start-page card keep
# the label "Generate": the card names the surface, not one of the providers
# (founder, 2026-09-23).
- insert:
    - id: generate
      name: '@muen/dsh-generate'
