name: Release
on:
  push:
    tags:
      # TWO TAG FORMS, both handled by scripts/pack-all.mjs: `vX.Y.Z` (version-only,
      # exactly one plugin may carry it) and `<plugin>-vX.Y.Z` (names its plugin, so
      # several plugins may sit at the same version — which is the normal state of a
      # monorepo, and was the reason the first two market releases here could not be
      # tagged).
      - 'v*'
      - '*-v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/pack-all.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
